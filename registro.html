<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TurnEasy | Registro</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    

    <header class="encabezado">

        <div class="logo">

            <img src="img/logo.png" alt="TurnEasy" class="logo-img">

        </div>

    </header>

   

    <main class="contenedor-principal">

        <!-- Imagen -->

        <section class="imagen-login">

            <img src="img/registro.png" alt="Registro">

        </section>

        <!-- Formulario -->

        <section class="formulario-login">

            <h2>Crear Cuenta</h2>

            <p>
                Complete la información para registrarse en TurnEasy.
            </p>

            <form id="registro">

                <div class="fila">

                    <div class="campo">

                        <label for="nombre">Nombre</label>

                        <input
                            type="text"
                            id="nombre"
                            placeholder="Ingrese su nombre">

                    </div>

                    <div class="campo">

                        <label for="apellido">Apellidos</label>

                        <input
                            type="text"
                            id="apellido"
                            placeholder="Ingrese sus apellidos">

                    </div>

                </div>

                <div class="fila">

                    <div class="campo">

                        <label for="tipoDocumento">

                            Tipo de documento

                        </label>

                        <select id="tipoDocumento">

                            <option>Seleccione</option>

                            <option>Cédula de Ciudadanía</option>

                            <option>Tarjeta de Identidad</option>

                            <option>Cédula de Extranjería</option>

                            <option>Pasaporte</option>

                        </select>

                    </div>

                    <div class="campo">

                        <label for="documento">

                            Número de documento

                        </label>

                        <input
                            type="number"
                            id="documento">

                    </div>

                </div>

                <div class="fila">

                    <div class="campo">

                        <label for="fecha">

                            Fecha de nacimiento

                        </label>

                        <input
                            type="date"
                            id="fecha"
                            name="fecha"
                            required>
                        

                    </div>

                    <div class="campo">

                        <label for="correo">

                            Correo electrónico

                        </label>

                        <input
                            type="email"
                            id="correo">

                    </div>

                </div>

                <div class="fila">

                    <div class="campo">

                        <label for="celular">

                            Celular

                        </label>

                        <input
                            type="tel"
                            id="celular">

                    </div>

                    <div class="campo">

                        <label for="password">

                            Contraseña

                        </label>

                        <input
                            type="password"
                            id="password">

                    </div>

                </div>

                <label for="confirmar">

                    Confirmar contraseña

                </label>

                <input
                    type="password"
                    id="confirmar">

                <div class="recordar">

                    <input
                        type="checkbox"
                        id="terminos">

                    <label for="terminos">

                        Acepto los términos y condiciones.

                    </label>

                </div>

                <button type="submit">

                    Registrarse

                </button>

                <div class="registro">

                    <p>

                        ¿Ya tienes una cuenta?

                        <a href="index.html">

                            Iniciar sesión

                        </a>

                    </p>

                </div>

            </form>

        </section>

    </main>

    <footer>

        <p>

            © 2026 TurnEasy | Todos los derechos reservados.

        </p>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
