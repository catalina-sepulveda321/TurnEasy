<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TurnEasy | Iniciar Sesión</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

   

    <header class="encabezado">

        <div class="logo">

            <img src="img/logo.png" alt="TurnEasy" class="logo-img">
        </div>

    </header>


    

    <main class="contenedor-principal">


       
        <section class="imagen-login">

            <img src="img/login.png" alt="Imagen Login">

        </section>


       

        <section class="formulario-login">

            <h2>Iniciar Sesión</h2>

            <p>

                Bienvenido.

                Ingrese sus credenciales para continuar.

            </p>

            <form id="login">

                <!-- Correo -->

                <label for="correo">

                    Correo electrónico

                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingrese su correo">


                <!-- Contraseña -->

                <label for="password">

                    Contraseña

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingrese su contraseña">


                <!-- Mostrar contraseña -->

                <div class="mostrar">

                    <input
                        type="checkbox"
                        id="mostrarPassword">

                    <label for="mostrarPassword">

                        Mostrar contraseña

                    </label>

                </div>


                <!-- Recordarme -->

                <div class="recordar">

                    <input
                        type="checkbox"
                        id="recordar">

                    <label for="recordar">

                        Recordarme

                    </label>

                </div>


                <!-- Olvidó contraseña -->

                <div class="olvido">

                    <a href="#">

                        ¿Olvidó su contraseña?

                    </a>

                </div>


                <!-- Botón -->

                <button type="submit">

                    Iniciar Sesión

                </button>


                <!-- Redes -->

                <div class="redes">

                    <button type="button" class="btn-social">
                        
                        <img src="img/google.png" alt="Google" class="icon-social">

                        Google

                    </button>

                    <button type="button" class="btn-social">
                        
                        <img src="img/facebook.png" alt="Facebook" class="icon-social">


                        Facebook

                    </button>

                </div>


                <!-- Registro -->

                <div class="registro">

                    <p>

                        ¿No tienes una cuenta?

                        <a href="registro.html">

                            Regístrate aquí

                        </a>

                    </p>

                </div>

            </form>

        </section>

    </main>


    

    <footer>

        <p>

            © 2026 TurnEasy | Todos los derechos reservados.

        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
